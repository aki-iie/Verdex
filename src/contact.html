<section class="contact-section">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Contact Form</div>
      <h2>문의 양식</h2>
    </div>

    <form onsubmit="return false;">
      <div class="form-grid">
        <div class="form-field">
          <label>이름 <span class="req">*</span></label>
          <input type="text" required>
        </div>
        <div class="form-field">
          <label>이메일 <span class="req">*</span></label>
          <input type="email" required>
        </div>
        <div class="form-field">
          <label>문의 유형 <span class="req">*</span></label>
          <select required style="font-family:var(--sans);font-size:14px;padding:12px 14px;border-radius:4px;border:1px solid rgba(18,32,26,0.18);background:var(--paper);color:var(--ink);">
            <option value="">선택해주세요</option>
            <option value="general">서비스 관련 문의</option>
            <option value="careers">채용 관련 문의</option>
            <option value="other">기타</option>
          </select>
        </div>
        <div class="form-field">
          <label>회사명 (선택)</label>
          <input type="text">
        </div>
        <div class="form-field full">
          <label>문의 내용 <span class="req">*</span></label>
          <textarea required placeholder="채용 문의이신 경우, 관심 있는 분야와 함께하고 싶은 이유를 함께 적어주세요."></textarea>
        </div>
      </div>
      <label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--slate);margin-bottom:20px;">
        <input type="checkbox" required style="margin-top:3px;">
        <span><a href="./privacy.html" style="color:var(--forest);font-weight:600;">개인정보처리방침</a>에 따른 개인정보 수집 및 이용에 동의합니다. <span style="color:var(--forest);">*</span></span>
      </label>
      <button class="submit-btn" type="submit">문의 제출</button>
    </form>

    <div class="contact-info">
      <div class="row"><b>베르덱스에이아이 주식회사</b></div>
      <div class="row">서울특별시 성동구 무학로6길 50, 101동 205호 (도선동, 성동삼성쉐르빌)</div>
      <div class="row">전화번호: 0502-1940-1960 · 운영시간: 평일 09:00–18:00 (점심시간 12:00–13:00)</div>
      <div class="row" style="margin-top:8px;"><a href="./location.html" style="color:var(--forest);font-weight:600;">지도 보기 →</a></div>
    </div>
  </div>
</section>
